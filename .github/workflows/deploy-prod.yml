name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  APPLICATION: atesmaps
  ECR_REPOSITORY: atesmaps-prod-api
  ENVIRONMENT: prod
  AWS_ACCOUNT_ID: '919542772080'
  AWS_IAM_ROLE_NAME: atesmaps-prod-api-gha-role
  AWS_REGION: eu-west-1

permissions:
  contents: read
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_IAM_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get commit SHA
        id: commit-sha
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get EC2 instance ID
        id: get_instance_id
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.APPLICATION }}-${{ env.ENVIRONMENT }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.commit-sha.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f etc/docker/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Create env file from SSM Parameter Store
        run: |
          SSM_PREFIX="/${{ env.APPLICATION }}/${{ env.ENVIRONMENT }}/api"

          aws ssm get-parameters-by-path \
            --path "$SSM_PREFIX" \
            --with-decryption \
            --recursive \
            --region ${{ env.AWS_REGION }} \
            --query "Parameters[*].{Name:Name,Value:Value}" \
            --output json \
          | jq -r '.[] | (.Name | ltrimstr("'"$SSM_PREFIX"'/")) + "=" + .Value' \
          > .env.atesmaps-api

          echo "IMAGE_TAG=${{ steps.commit-sha.outputs.tag }}" >> .env.atesmaps-api

      - name: Encode environment file to deploy
        run: |
          base64 .env.atesmaps-api > .env.atesmaps-api-b64.txt

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ steps.get_instance_id.outputs.instance_id }}" \
            --comment "Deploy atesmaps api" \
            --parameters 'commands=[
              "rm -f /opt/atesmaps/.env.atesmaps-api",
              "echo \"'"$(cat .env.atesmaps-api-b64.txt)"'\" | base64 -d > /opt/atesmaps/.env.atesmaps-api",
              "cd /opt/atesmaps",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com",
              "docker compose pull atesmaps-api",
              "docker compose rm -s -f atesmaps-api",
              "docker compose up -d --no-deps atesmaps-api",
              "docker image prune -a -f"
            ]' \
            --region ${{ env.AWS_REGION }}
